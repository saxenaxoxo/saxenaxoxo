<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Artifact Bridge</title>
<desc id="d">Open source, MIT license, not in active development. Turns Claude artifacts and other HTML designs into native, editable After Effects compositions with real text layers, shape layers and keyframes. Node.js and ExtendScript.</desc>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.3" fill="#ffffff" fill-opacity="0.09"/>
  </pattern>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#C6FF3D" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1200" height="340" rx="24" fill="#141414"/>
<rect width="1200" height="340" rx="24" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#2a2a2a"/>

