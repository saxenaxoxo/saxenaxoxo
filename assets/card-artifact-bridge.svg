  <text x="351.5" y="61.4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" letter-spacing="1" fill="#C6FF3D">OPEN SOURCE</text>
