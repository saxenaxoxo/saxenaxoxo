<text x="282" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1" fill="#F5F5F5">Artifact Bridge</text>
<text x="282" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#C6FF3D">HTML designs in, editable After Effects comps out.</text>
<text x="282" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#9C9C9C">Turns Claude artifacts into real text layers, shape layers</text>
