  <rect x="60" y="45" width="24" height="10" rx="3" fill="#d291ff" fill-opacity="0.7"/>
  <rect x="60" y="61" width="24" height="10" rx="3" fill="#d291ff" fill-opacity="0.45"/>
</svg>
