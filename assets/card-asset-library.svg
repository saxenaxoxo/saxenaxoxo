<title id="t">Asset Library</title>
<desc id="d">Flagship tool. Free and open source, MIT license. Every asset you own, one search away: a Premiere Pro panel to search, preview and place your own footage, music, sound effects and images. Built with TypeScript and Electron, for macOS.</desc>
